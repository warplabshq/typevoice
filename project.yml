# XcodeGen spec. `xcodegen generate` → Murmur.xcodeproj (git-ignored).
# Archive from Xcode (Product › Archive) or: make archive
name: Murmur
options:
  bundleIdPrefix: com.priyam
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: "REPLACE-ME"        # your Team ID (Xcode › Settings › Accounts)
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.15.7
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.90.0
targets:
  Murmur:
    type: application
    platform: macOS
    sources:
      - path: Sources/Murmur
      - path: Packaging/Assets.xcassets
    dependencies:
      - package: FluidAudio
      - package: RevenueCat
        product: RevenueCat
      - sdk: libsqlite3.tbd
    entitlements:
      path: Packaging/Murmur.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.priyam.murmur
        PRODUCT_NAME: Murmur
        INFOPLIST_FILE: Packaging/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        CODE_SIGN_ENTITLEMENTS: Packaging/Murmur.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
    preBuildScripts: []
schemes:
  Murmur:
    build:
      targets:
        Murmur: all
    run:
      config: Debug
    archive:
      config: Release
